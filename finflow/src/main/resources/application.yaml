spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finflow
    username: finflow
    password: finflow_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info