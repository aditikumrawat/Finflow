spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finflow}
    username: ${SPRING_DATASOURCE_USERNAME:finflow}
    password: ${SPRING_DATASOURCE_PASSWORD:finflow_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  server:
    port: 8080

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics

    endpoint:
      health:
        probes:
          enabled: true
        show-details: always

      metrics:
        tags:
          application: finflow